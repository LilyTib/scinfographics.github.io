# Every evening: pull the latest domestic screwworm case count from USDA, save it,
# and publish the site. Also publishes whenever you change files in the repo.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Run it by hand any time: Actions tab -> "Update case count and publish" -> Run workflow.
name: Update case count and publish

on:
  schedule:
    - cron: "17 0 * * *"    # every day at 00:17 UTC (7:17pm Eastern), after USDA's 6pm update
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write   # save data/cases.json back to the repo
  pages: write      # publish the site
  id-token: write   # required by the Pages deploy step

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest count from USDA
        if: github.event_name != 'push'
        run: python3 scripts/update_cases.py

      - name: Save the new count to the repo
        if: github.event_name != 'push'
        run: |
          git config user.name "case-count-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cases.json
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Update screwworm case count from USDA"
            git push
          fi

      # Publish the site straight from this job. (A commit made by a workflow
      # does not trigger GitHub's normal Pages rebuild, so we deploy here.)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
