# Checks USDA's screwworm tracker once a day and updates data/cases.json.
name: Update screwworm case count

on:
  schedule:
    - cron: "17 12 * * *"   # every day at 7:17am Eastern
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest count from USDA
        run: python3 scripts/update_cases.py

      - name: Save if the count changed
        run: |
          git config user.name "case-count-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cases.json
          if git diff --cached --quiet; then
            echo "Count unchanged; nothing to commit."
          else
            git commit -m "Update screwworm case count from USDA"
            git push
          fi
